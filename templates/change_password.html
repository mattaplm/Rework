{% extends "base.html" %}
{% block title %}Change password · Doors Rework{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="card auth-card" method="post">
    <h2>Choose a new PIN</h2>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    <div class="field">
      <label for="new_password">New PIN (4 digits)</label>
      <input type="password" id="new_password" name="new_password" inputmode="numeric" pattern="\d{4}" maxlength="4" required>
    </div>
    <div class="field">
      <label for="confirm">Confirm PIN</label>
      <input type="password" id="confirm" name="confirm" inputmode="numeric" pattern="\d{4}" maxlength="4" required>
    </div>
    <button type="submit" class="btn-primary">Save</button>
  </form>
</div>
{% endblock %}
